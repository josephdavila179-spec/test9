<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baseball Scorecard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Baseball Scorecard</h1>
        <p>Keep track of every inning.</p>
    </header>

    <main>
        <h2>Baseball Game</h2>
        <table>
            <thead>
                <tr>
                    <th>Team</th>
                    <th>1</th><th>2</th><th>3</th>
                    <th>4</th><th>5</th><th>6</th>
                    <th>7</th><th>8</th><th>9</th>
                    <th>Runs</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Home Team</th>
                    <td contenteditable="true">2</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">1</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">3</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">1</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">2</td>
                    <td>9</td>
                </tr>
                <tr>
                    <th>Away Team</th>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">1</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">2</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">1</td>
                    <td contenteditable="true">0</td>
                    <td contenteditable="true">1</td>
                    <td contenteditable="true">0</td>
                    <td>5</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>Baseball Scorecard | Every inning counts!</footer>
</body>
</html>
