<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowling Scorecard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bowling Scorecard</h1>
        <p>Track your frames and final score.</p>
    </header>

    <main>
        <h2>Bowling Game</h2>
        <table>
            <thead>
                <tr>
                    <th>Player</th>
                    <th>1</th><th>2</th><th>3</th>
                    <th>4</th><th>5</th><th>6</th>
                    <th>7</th><th>8</th><th>9</th>
                    <th>10</th><th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Player 1</th>
                    <td contenteditable="true">X</td>
                    <td contenteditable="true">7/</td>
                    <td contenteditable="true">8/</td>
                    <td contenteditable="true">9-</td>
                    <td contenteditable="true">X</td>
                    <td contenteditable="true">72</td>
                    <td contenteditable="true">X</td>
                    <td contenteditable="true">8/</td>
                    <td contenteditable="true">X</td>
                    <td contenteditable="true">X</td>
                    <td>176</td>
                </tr>
                <tr>
                    <th>Player 2</th>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td></td>
                </tr>
                <tr>
                    <th>Player 3</th>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>Bowling Scorecard | Aim for a strike!</footer>
</body>
</html>
